<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hands preview</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/hands.css">
  <style>
    body { padding: 16px; }
    .panel { max-width: 560px; margin: 0 auto 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    select, input[type=range] { font: inherit; }
    .stage-box { min-height: 340px; display: flex; align-items: flex-end; justify-content: center; padding-top: 30px; }
    .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
    .gallery .hand-wrap { width: 100%; }
    .gallery .hand-wrap { transform: none !important; }
    label { font-size: .9rem; }
  </style>
</head>
<body>
  <div class="panel">
    <h2 style="min-height:0">Round sequence</h2>
    <div class="stage-box"><div id="stage"></div></div>
    <p id="caption" class="muted center small">idle</p>
    <div class="row">
      <label>You <select id="mine"><option>rock</option><option selected>paper</option><option>scissors</option></select></label>
      <label>Friend <select id="theirs"><option>rock</option><option>paper</option><option selected>scissors</option></select></label>
      <label>Network delay <select id="delay"><option value="0">none</option><option value="1500">1.5 s</option><option value="3500">3.5 s</option></select></label>
    </div>
    <div class="row">
      <button id="play" class="primary">Play</button>
      <button id="reset">Reset</button>
      <label><input type="checkbox" id="slow"> Slow motion (×3)</label>
    </div>
  </div>

  <div class="panel">
    <h2 style="min-height:0">Pose gallery</h2>
    <div class="gallery" id="gallery"></div>
  </div>

  <script type="module">
    import {HandStage} from '../js/hands.js';
    import {resolve} from '../js/game.js';

    const $ = (id) => document.getElementById(id);
    const stage = new HandStage($('stage'));
    let running = false;

    $('play').onclick = async () => {
      if (running) return;
      running = true;
      stage.reset();
      await new Promise((r) => setTimeout(r, 150));
      const mine = $('mine').value, theirs = $('theirs').value;
      const outcome = resolve(mine, theirs);

      $('caption').textContent = 'you lock in…';
      await stage.lockIn('me');
      $('caption').textContent = 'friend locks in…';
      await stage.lockIn('them');
      $('caption').textContent = 'shaking while the network exchanges reveals…';
      stage.startShake();
      await new Promise((r) => setTimeout(r, +$('delay').value * stage.slow));
      await stage.reveal({mine, theirs, outcome});
      $('caption').textContent = `${mine} vs ${theirs}: you ${outcome}`;
      running = false;
    };
    $('reset').onclick = () => { stage.reset(); $('caption').textContent = 'idle'; running = false; };
    $('slow').onchange = (e) => stage.setSlow(e.target.checked ? 3 : 1);

    // static gallery of every pose, both orientations
    for (const pose of ['open', 'rock', 'paper', 'scissors']) {
      const cell = document.createElement('div');
      const holder = document.createElement('div');
      cell.append(holder, Object.assign(document.createElement('span'), {className: 'muted small', textContent: pose}));
      $('gallery').append(cell);
      const g = new HandStage(holder);
      holder.style.display = 'block';
      g.hands.them.remove();
      g.hands.me.dataset.state = 'shown';
      g.hands.me.querySelector('.hand').dataset.pose = pose;
    }
  </script>
</body>
</html>
