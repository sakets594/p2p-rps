<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PROTOTYPE - Cup Pong demo match</title>
<!--
  PROTOTYPE - throwaway. A demo match against a bot, built to try the "reference feel":
  proportions and physics numbers measured from a popular cup-pong game (scaled to our units),
  swipe-LENGTH power with a 0.5 s limit, 5 rounds x 2 balls, extra turn on two hits, instant win
  on clearing every cup, rack swap on each turn change, intro + first-turn spinner.
  All art, layout and code here are original; only numbers and game rules were taken from the
  reference. No sound. State is in memory only.
-->
<style>
  :root { color-scheme: dark; --ink: #1d2733; --card: #fdf8ee; --accent: #6c63d9; --you: #4a8fe0; --rival: #e0524b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #12161c; font-family: system-ui, -apple-system, sans-serif; color: #fff; overflow-x: hidden; }
  #tag { background: #7a3b00; font-size: 11px; text-align: center; padding: 3px; }
  #app { position: relative; max-width: 460px; margin: 0 auto; height: calc(100dvh - 22px); min-height: 480px; overflow: hidden; background: #9ec9d8; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  /* HUD */
  #hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 5; }
  .pcard { width: 64px; background: var(--card); color: var(--ink); border-radius: 14px; padding: 6px 4px 5px; text-align: center; border: 3px solid transparent; box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: transform .25s, border-color .25s; }
  .pcard.active { border-color: var(--accent); transform: translateY(2px) scale(1.05); }
  .av { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 2px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 16px; }
  .nm { font-size: 10px; font-weight: 800; letter-spacing: .06em; }
  .sc { font-size: 22px; font-weight: 900; line-height: 1; transition: transform .2s; }
  .sc.bump { transform: scale(1.5); }
  #roundPill { background: var(--ink); border-radius: 16px; padding: 6px 12px 8px; text-align: center; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #roundTxt { font-size: 11px; font-weight: 800; letter-spacing: .08em; }
  #dots { display: flex; gap: 6px; justify-content: center; margin-top: 5px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; background: #fff; transition: opacity .2s, transform .2s; }
  #dots i.used { opacity: .25; transform: scale(.7); }
  /* centre message */
  #msg { position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0) scale(.6); opacity: 0; z-index: 6; pointer-events: none;
         background: var(--ink); color: #fff; padding: 10px 22px; border-radius: 16px; font-weight: 900; letter-spacing: .08em; font-size: 20px; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #msg.show { animation: pop 1.1s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.5); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1.12); } 30% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -6px) scale(1); } }
  #msg.hold { animation: popHold .35s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes popHold { from { opacity: 0; transform: translate(-50%, 8px) scale(.5); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  /* overlays */
  .ov { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; transition: opacity .5s, backdrop-filter .5s; }
  .ov.hidden { opacity: 0; pointer-events: none; }
  #intro { background: rgba(31,36,52,.55); backdrop-filter: blur(6px); align-content: center; gap: 22px; }
  #introCards { display: flex; gap: 14px; }
  .big { width: 112px; background: var(--card); color: var(--ink); border-radius: 18px; padding: 14px 8px 8px; text-align: center; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
  .big .av { width: 70px; height: 70px; font-size: 32px; margin-bottom: 8px; }
  .big .nm { background: #4b3a68; color: #fff; border-radius: 10px; padding: 5px; font-size: 12px; }
  #introCards .big:first-child { animation: fromL .55s cubic-bezier(.2,1.2,.4,1) both; }
  #introCards .big:last-child { animation: fromR .55s .15s cubic-bezier(.2,1.2,.4,1) both; }
  @keyframes fromL { from { transform: translateX(-140px) rotate(-8deg); opacity: 0; } }
  @keyframes fromR { from { transform: translateX(140px) rotate(8deg); opacity: 0; } }
  .pillbig { background: #4b3a68; padding: 10px 22px; border-radius: 14px; font-weight: 900; letter-spacing: .08em; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #startPill { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 7; background: var(--ink); padding: 8px 18px; border-radius: 12px; font-weight: 800; font-size: 12px; letter-spacing: .08em; opacity: 0; transition: opacity .3s; }
  #spin { background: rgba(31,36,52,.25); align-content: center; gap: 18px; }
  #dial { width: 120px; height: 120px; border-radius: 50%; background: var(--card); position: relative; box-shadow: 0 5px 0 rgba(0,0,0,.3); }
  #needle { position: absolute; left: 50%; top: 50%; width: 10px; height: 74px; margin-left: -5px; margin-top: -64px; transform-origin: 50% 64px; background: linear-gradient(#ef6a6a 0 60%, transparent 60%); border-radius: 6px; }
  #needle::after { content: ""; position: absolute; left: -3px; top: 0; width: 16px; height: 16px; border-radius: 50%; background: #ef6a6a; }
  .who { background: #4b3a68; padding: 7px 20px; border-radius: 12px; font-weight: 900; letter-spacing: .08em; transition: background .3s, transform .3s; }
  .who.win { background: var(--accent); transform: scale(1.15); }
  #end { background: rgba(18,22,28,.7); backdrop-filter: blur(4px); align-content: center; gap: 12px; text-align: center; }
  #end h2 { margin: 0; font-size: 34px; letter-spacing: .06em; }
  #end p { margin: 0; opacity: .85; }
  button { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #tune { max-width: 460px; margin: 0 auto; padding: 8px 12px; }
  .row { display: grid; grid-template-columns: 120px 1fr 52px; gap: 6px; align-items: center; margin: 3px 0; font-size: 13px; }
  .row input { width: 100%; }
  .row output { font: 12px ui-monospace, monospace; text-align: right; }
  #dbg { font: 11px ui-monospace, monospace; white-space: pre-wrap; color: #9fb3c4; }
</style>
</head>
<body>
<div id="tag">PROTOTYPE demo match - build 3 - one bounce + bounce-aware helper, no sound</div>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="pcard" id="cardYou"><div class="av" style="background:var(--you)">Y</div><div class="nm">YOU</div><div class="sc" id="scYou">0</div></div>
    <div id="roundPill"><div id="roundTxt">ROUND 1/5</div><div id="dots"><i></i><i></i></div></div>
    <div class="pcard" id="cardRival"><div class="av" style="background:var(--rival)">R</div><div class="nm">RIVAL</div><div class="sc" id="scRival">0</div></div>
  </div>
  <div id="msg"></div>
  <div id="startPill">STARTING NOW...</div>
  <div id="intro" class="ov hidden">
    <div id="introCards">
      <div class="big"><div class="av" style="background:var(--you)">Y</div><div class="nm">YOU</div></div>
      <div class="big"><div class="av" style="background:var(--rival)">R</div><div class="nm">RIVAL</div></div>
    </div>
    <div class="pillbig">RIVAL FOUND!</div>
  </div>
  <div id="spin" class="ov hidden">
    <div class="who" id="whoYou">YOU</div>
    <div id="dial"><div id="needle"></div></div>
    <div class="who" id="whoRival">RIVAL</div>
  </div>
  <div id="end" class="ov hidden"><h2 id="endTitle"></h2><p id="endSub"></p><button id="again">Play again</button></div>
</div>
<details id="tune"><summary>Swipe, helper and bot settings</summary>
  <div id="sliders"></div>
  <label><input type="checkbox" id="assistOn" checked> forgiveness helper on</label>
  <label style="margin-left:12px"><input type="checkbox" id="skipIntro"> skip intro</label>
  <div id="dbg"></div>
</details>

<script type="module">
import {REFERENCE, layoutCups, simulate, predictAtHeight} from '../js/games/cup-pong/physics.js';
import {shapeThrow, ASSIST_DEFAULTS} from '../js/games/cup-pong/aim-assist.js';

// ---- tunables ------------------------------------------------------------------------
const P = {...REFERENCE};
const S = {minLen: 0.08, maxLen: 0.42, timeMs: 500, angleRange: 50, angleStep: 1.25, grab: 2.6, botSigmaA: 5, botSigmaP: 9, slow: 1};
const A = {...ASSIST_DEFAULTS, xMargin: 0.06, zOvershoot: 0.25, captureRadius: 0.45, magnetRadius: 0.1, magnet: 0.35, formationPull: 0.6, lateralPull: 0.5, magnetMax: 0.8};
// reference camera: 51 deg tilt, 40 deg vertical field of view, ~1.66 m up and 0.75 m behind the ball
const CAM = {y: 1.66, z: -0.75, pitch: 0.89, fov: 40, hz: 0.5};
const sliderDefs = [
  [S, 'minLen', 'min swipe (screen h)', 0.02, 0.3, 0.01],
  [S, 'maxLen', 'full-power swipe', 0.2, 0.8, 0.01],
  [S, 'timeMs', 'swipe time limit ms', 200, 1500, 50],
  [S, 'angleRange', 'full-aim angle (deg)', 20, 80, 1],
  [A, 'snap', 'scoring snap reach', 0, 2.5, 0.1],
  [A, 'snapPower', 'snap power range', 0, 24, 1],
  [A, 'snapAngle', 'snap angle range', 0, 12, 1],
  [S, 'botSigmaA', 'bot aim error', 0, 20, 1],
  [S, 'botSigmaP', 'bot power error', 0, 30, 1],
  [S, 'slow', 'ball speed x', 0.3, 1.5, 0.05],
  [CAM, 'y', 'camera height', 0.6, 3, 0.05],
  [CAM, 'z', 'camera back', -2, 0.3, 0.05],
  [CAM, 'pitch', 'camera tilt', 0.3, 1.4, 0.01],
  [CAM, 'fov', 'camera fov', 25, 70, 1],
  [CAM, 'hz', 'frame up/down', 0.2, 0.8, 0.01],
];
const $ = (id) => document.getElementById(id);
for (const [obj, key, label, min, max, step] of sliderDefs) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}"><output></output>`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  inp.value = obj[key]; out.textContent = obj[key];
  inp.oninput = () => { obj[key] = +inp.value; out.textContent = inp.value; };
  $('sliders').appendChild(row);
}

// ---- canvas + projection ---------------------------------------------------------------
const canvas = $('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); const r = canvas.getBoundingClientRect(); W = r.width; H = r.height; canvas.width = W * dpr; canvas.height = H * dpr; }
window.addEventListener('resize', resize); resize();
function project(x, y, z) {
  const sp = Math.sin(CAM.pitch), cp = Math.cos(CAM.pitch);
  const X = x - 0, Y = y - CAM.y, Z = z - CAM.z;
  const zc = Math.max(0.05, -Y * sp + Z * cp), yc = Y * cp + Z * sp;
  const F = (H * 0.5) / Math.tan((CAM.fov * Math.PI / 180) / 2);
  return [W / 2 + F * X / zc, H * CAM.hz - F * yc / zc, F / zc];
}
const ryOf = (x, y, z, r) => Math.abs(project(x, y, z + r)[1] - project(x, y, z)[1]) || 1;

// ---- game state -----------------------------------------------------------------------
const TOTAL_ROUNDS = 5, BALLS = 2, CUPS = 10;
const st = {phase: 'idle', turn: 0, first: 0, round: 1, ball: 1, turnHits: 0, scores: [0, 0], racks: [], canThrow: false, ballVisible: false, ballScale: 1, thrown: false, flight: null, fx: [], over: false};
const COLORS = [
  {a: '#6fb1f5', b: '#4a8fe0', c: '#2d5fa6', d: '#1b3d70', rim: '#e3f0ff', in1: '#0d1d36', in2: '#243f6a'}, // your cups: blue
  {a: '#f0716a', b: '#d9433c', c: '#b02c27', d: '#7e1c19', rim: '#ffe3df', in1: '#2b0907', in2: '#6a1b17'}, // rival cups: red
];
function newRacks() { return [0, 1].map(() => layoutCups(CUPS, P).map((c) => ({...c, sc: 1, lift: 0}))); }
const target = () => st.racks[1 - st.turn];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const ease = {
  out: (k) => 1 - Math.pow(1 - k, 3),
  back: (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  sineOut: (k) => Math.sin(k * Math.PI / 2),
  inOut: (k) => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2,
};
function tween(ms, fn, delay = 0) {
  return new Promise((res) => {
    const t0 = performance.now() + delay;
    const step = (now) => { const k = (now - t0) / ms; if (k < 0) return requestAnimationFrame(step); fn(Math.min(1, k)); if (k >= 1) res(); else requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// ---- HUD / messages ----------------------------------------------------------------------
function updateHud() {
  $('scYou').textContent = st.scores[0]; $('scRival').textContent = st.scores[1];
  $('roundTxt').textContent = `ROUND ${Math.min(st.round, TOTAL_ROUNDS)}/${TOTAL_ROUNDS}`;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('used', i < st.ball - 1));
  $('cardYou').classList.toggle('active', st.phase === 'play' && st.turn === 0);
  $('cardRival').classList.toggle('active', st.phase === 'play' && st.turn === 1);
}
function bump(i) { const el = i === 0 ? $('scYou') : $('scRival'); el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 250); }
async function msg(text, ms = 1100) {
  const m = $('msg'); m.classList.remove('show', 'hold'); void m.offsetWidth; m.textContent = text; m.classList.add('show');
  await wait(ms);
}
function holdMsg(text) { const m = $('msg'); m.classList.remove('show', 'hold'); void m.offsetWidth; m.textContent = text; m.classList.add('hold'); }
function clearMsg() { const m = $('msg'); m.classList.remove('show', 'hold'); m.style.opacity = 0; setTimeout(() => m.style.opacity = '', 50); }
const show = (id, on) => $(id).classList.toggle('hidden', !on);

// ---- rack animations (out / in) --------------------------------------------------------------
async function rackOut(rack) {
  const live = rack.filter((c) => c.alive);
  await Promise.all(live.map((c, i) => tween(320, (k) => { c.sc = 1 - ease.inOut(k); c.lift = 0.1 * ease.inOut(k); }, i * 35)));
}
async function rackIn(rack) {
  const live = rack.filter((c) => c.alive).sort((a, b) => b.z - a.z); // back row first
  live.forEach((c) => { c.sc = 0; c.lift = 0.14; });
  await Promise.all(live.map((c, i) => tween(380, (k) => { const e = ease.back(k); c.sc = Math.min(1, ease.out(k) * 1.1); c.lift = 0.14 * (1 - e); }, i * 45)));
  live.forEach((c) => { c.sc = 1; c.lift = 0; });
}
async function liftOutCup(c) {
  await tween(500, (k) => { c.lift = 0.16 * ease.out(k); c.sc = 1 - ease.inOut(k); });
  c.alive = false; c.lift = 0; c.sc = 1;
}
function poof(x, y, z) { st.fx.push({kind: 'poof', x, y, z, t0: performance.now()}); }
function confetti() { for (let i = 0; i < 60; i++) st.fx.push({kind: 'conf', t0: performance.now(), vx: (Math.random() - .5) * 700, vy: -(200 + Math.random() * 500), x: W / 2, y: H * 0.35, hue: Math.random() * 360}); }

// ---- drawing ---------------------------------------------------------------------------------------
function drawCup(c, col) {
  const lift = c.lift, s0 = Math.max(0.001, c.sc);
  const [bx, by, s] = project(c.x, lift, c.z), [tx, ty] = project(c.x, lift + P.cupH * s0, c.z);
  const rt = P.cupRimR * s * s0, rb = rt * 0.68;
  const ryT = ryOf(c.x, lift + P.cupH * s0, c.z, P.cupRimR * s0), ryB = ryOf(c.x, lift, c.z, P.cupRimR * s0) * 0.68;
  if (lift < 0.01) { const sh = ctx.createRadialGradient(bx, by, 0, bx, by, rt * 1.5); sh.addColorStop(0, 'rgba(0,0,0,.33)'); sh.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = sh; ctx.beginPath(); ctx.ellipse(bx, by, rt * 1.5, ryB * 1.6, 0, 0, 7); ctx.fill(); }
  const g = ctx.createLinearGradient(tx - rt, 0, tx + rt, 0);
  g.addColorStop(0, col.a); g.addColorStop(0.35, col.b); g.addColorStop(0.75, col.c); g.addColorStop(1, col.d);
  ctx.beginPath(); ctx.moveTo(tx - rt, ty); ctx.lineTo(bx - rb, by); ctx.ellipse(bx, by, rb, ryB, 0, Math.PI, 0, true); ctx.lineTo(tx + rt, ty); ctx.ellipse(tx, ty, rt, ryT, 0, 0, Math.PI, true); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  const inner = ctx.createLinearGradient(0, ty - ryT, 0, ty + ryT); inner.addColorStop(0, col.in1); inner.addColorStop(1, col.in2);
  ctx.beginPath(); ctx.ellipse(tx, ty, rt, ryT, 0, 0, 7); ctx.fillStyle = inner; ctx.fill();
  ctx.lineWidth = Math.max(1.5, rt * 0.12); ctx.strokeStyle = col.rim; ctx.stroke();
}
function drawBall(pos, scale = 1) {
  const [sx, sy, s] = project(pos[0], pos[1], pos[2]), [shx, shy] = project(pos[0], 0, pos[2]);
  const r = Math.max(P.ballR * s * scale, 2.5), lift = Math.min(1, Math.max(0, (pos[1] - P.ballR) / 0.3));
  ctx.fillStyle = `rgba(0,0,0,${0.32 - 0.18 * lift})`; ctx.beginPath(); ctx.ellipse(shx, shy, r * (1 + 0.5 * lift), r * 0.4 * (1 + 0.5 * lift), 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(sx - r * 0.35, sy - r * 0.4, r * 0.1, sx, sy, r); g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#eef0f3'); g.addColorStop(1, '#a9b1ba');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
}
function drawScene(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.clearRect(0, 0, W, H);
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.7); sky.addColorStop(0, '#9fc9dc'); sky.addColorStop(0.6, '#e6e0c8'); sky.addColorStop(1, '#d9b79a'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // soft hills
  ctx.fillStyle = 'rgba(120,150,170,.35)'; ctx.beginPath(); const hz = project(0, 0, P.tableZ1 + 0.4)[1]; ctx.moveTo(0, hz); for (let i = 0; i <= 8; i++) ctx.lineTo(W * i / 8, hz - 18 - 14 * Math.sin(i * 1.7)); ctx.lineTo(W, hz + 40); ctx.lineTo(0, hz + 40); ctx.fill();
  // table
  const hw = P.tableHalfW, z0 = P.tableZ0, z1 = P.tableZ1;
  const tbl = [[-hw, 0, z0], [hw, 0, z0], [hw, 0, z1], [-hw, 0, z1]].map((q) => project(...q));
  const tg = ctx.createLinearGradient(0, tbl[3][1], 0, tbl[0][1]); tg.addColorStop(0, '#d7a2d9'); tg.addColorStop(0.5, '#f0b9a8'); tg.addColorStop(1, '#f6d99a');
  ctx.beginPath(); tbl.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fillStyle = tg; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 4; ctx.stroke();
  // cups far to near; target rack only
  if (st.racks.length && (st.phase === 'play' || st.phase === 'over')) {
    const rack = target(), col = COLORS[st.turn === 0 ? 1 : 0];
    rack.filter((c) => c.alive).sort((a, b) => b.z - a.z).forEach((c) => drawCup(c, col));
  }
  // flight / resting ball
  if (st.flight) drawBall(st.flight.pos);
  else if (st.ballVisible) {
    const pos = [0, P.releaseH, 0]; drawBall(pos, st.ballScale);
    if (st.canThrow) {
      const [sx, sy, s] = project(...pos), gr = grabRadius(s);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.arc(sx, sy, gr, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      if (!st.thrown && !swipe) { // finger hint: a circle sliding up from the ball
        const k = ((now / 1400) % 1), e = ease.inOut(k), fx = sx, fy = sy - e * H * 0.22;
        ctx.fillStyle = `rgba(255,255,255,${0.65 * (1 - Math.abs(k - 0.5) * 1.4)})`; ctx.beginPath(); ctx.arc(fx, fy, 16, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.setLineDash([3, 8]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(fx, fy); ctx.stroke(); ctx.setLineDash([]);
      }
      if (swipe) { // power ring grows as the swipe gets longer
        const t = Math.min(1, Math.max(0, (swipe.len - S.minLen) / (S.maxLen - S.minLen)));
        ctx.strokeStyle = `hsl(${120 - 120 * t},85%,55%)`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(sx, sy, gr * 0.5 + t * gr * 0.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.03, t)); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,224,80,.9)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(swipe.x0, swipe.y0); ctx.lineTo(swipe.x, swipe.y); ctx.stroke();
      }
    }
  }
  // fx
  st.fx = st.fx.filter((f) => now - f.t0 < (f.kind === 'poof' ? 500 : 1800));
  for (const f of st.fx) {
    const k = (now - f.t0) / (f.kind === 'poof' ? 500 : 1800);
    if (f.kind === 'poof') { const [px, py, ps] = project(f.x, f.y, f.z); ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 4 * (1 - k) + 1; ctx.beginPath(); ctx.arc(px, py, P.ballR * ps * (1 + 4 * ease.out(k)), 0, 7); ctx.stroke(); }
    else { const t = (now - f.t0) / 1000; ctx.fillStyle = `hsla(${f.hue},85%,60%,${1 - k})`; ctx.fillRect(f.x + f.vx * t, f.y + f.vy * t + 900 * t * t, 7, 5); }
  }
  if (toast.text && now < toast.until) { ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 4; ctx.fillText(toast.text, W / 2, H * 0.8); ctx.shadowBlur = 0; }
}
const toast = {text: '', until: 0};
const say = (t) => { toast.text = t; toast.until = performance.now() + 1200; };
const grabRadius = (s) => Math.max(P.ballR * s * S.grab, 40);

// ---- swipe input (length-based, with a time limit) -------------------------------------------------------
let swipe = null;
canvas.addEventListener('pointerdown', (e) => {
  if (!st.canThrow) return;
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const [bx, by, s] = project(0, P.releaseH, 0);
  if (Math.hypot(x - bx, y - by) > grabRadius(s)) { say('start the swipe on the ball'); return; }
  canvas.setPointerCapture(e.pointerId);
  swipe = {x0: x, y0: y, x, y, t0: e.timeStamp, len: 0, dead: false};
});
canvas.addEventListener('pointermove', (e) => {
  if (!swipe || swipe.dead) return;
  const r = canvas.getBoundingClientRect(); swipe.x = e.clientX - r.left; swipe.y = e.clientY - r.top;
  swipe.len = Math.hypot(swipe.x - swipe.x0, swipe.y - swipe.y0) / H;
  if (e.timeStamp - swipe.t0 > S.timeMs) { swipe.dead = true; say('too slow - swipe quicker'); return; }
  if (swipe.y > swipe.y0) return; // no backward swipes
  if (swipe.len >= S.maxLen) { const s = swipe; swipe = null; fire(s); } // reaching full length fires at once
});
canvas.addEventListener('pointerup', (e) => {
  if (!swipe) return; const s = swipe; swipe = null;
  if (s.dead) return;
  s.x = e.clientX - canvas.getBoundingClientRect().left; s.y = e.clientY - canvas.getBoundingClientRect().top;
  s.len = Math.hypot(s.x - s.x0, s.y - s.y0) / H;
  if (e.timeStamp - s.t0 > S.timeMs) { say('too slow - swipe quicker'); return; }
  if (s.y >= s.y0) { say('swipe upward'); return; }
  if (s.len < S.minLen) { say('swipe longer'); return; }
  fire(s);
});
canvas.addEventListener('pointercancel', () => { swipe = null; });

function fire(s) {
  const dx = s.x - s.x0, dy = s.y - s.y0;
  let ang = Math.atan2(dx, -dy) * 57.29578;
  ang = Math.max(-S.angleRange, Math.min(S.angleRange, ang));
  ang = Math.round(ang / S.angleStep) * S.angleStep; // the reference snaps the aim into small steps
  const angleQ = Math.round(ang / S.angleRange * 127);
  const t = Math.min(1, Math.max(0, (s.len - S.minLen) / (S.maxLen - S.minLen)));
  const powerQ = Math.round(255 * t);
  let a = angleQ, p = powerQ, note = '';
  if ($('assistOn').checked) { const sh = shapeThrow({angleQ, powerQ}, target(), P, A); a = sh.angleQ; p = sh.powerQ; note = ` -> helper ${a}/${p} ${JSON.stringify(sh.steps)}`; }
  $('dbg').textContent = `swipe ${s.len.toFixed(2)} screen-heights  angle ${ang.toFixed(1)} deg  raw ${angleQ}/${powerQ}${note}`;
  st.thrown = true; takeShot(a, p);
}

// ---- a shot -----------------------------------------------------------------------------------------------------
function aimAt(c) { // the physical input that lands on a cup (used by the bot)
  const angleQ = Math.max(-127, Math.min(127, Math.round(c.x / c.z / P.aimSlope * 127)));
  let lo = 0, hi = 255; while (lo < hi) { const m = (lo + hi) >> 1; if (predictAtHeight(angleQ, m, P.cupH, P).z >= c.z) hi = m; else lo = m + 1; }
  return {angleQ, powerQ: lo};
}
const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += Math.random(); return (u - 3) * 1.414; };

async function takeShot(angleQ, powerQ) {
  st.canThrow = false; st.ballVisible = false;
  const rack = target();
  const sim = simulate(angleQ, powerQ, rack, P);
  const who = st.turn;
  st.ball += 0; // ball counter is advanced after the shot resolves
  await playFlight(sim);
  if (sim.outcome !== 'in') { const f = sim.frames, n = f.length - 3; poof(f[n], Math.max(f[n + 1], P.ballR), f[n + 2]); } // a miss ends with a pop
  let hit = false;
  if (sim.outcome === 'in') {
    hit = true;
    const c = rack[sim.cup]; poof(c.x, P.cupH, c.z);
    st.scores[who]++; st.turnHits++; bump(who); updateHud();
    await wait(400); await liftOutCup(c); await wait(500);
  } else await wait(450);
  await afterShot(hit);
}
function playFlight(sim) {
  const f = sim.frames, n = f.length / 3;
  st.flight = {pos: [0, P.releaseH, 0]};
  return tween(Math.max(300, (n - 1) / 60 * 1000 / S.slow), (k) => {
    const x = k * (n - 1), i = Math.min(n - 1, Math.floor(x)), j = Math.min(n - 1, i + 1), t = x - i;
    st.flight.pos = [0, 1, 2].map((q) => f[i * 3 + q] + (f[j * 3 + q] - f[i * 3 + q]) * t);
  }).then(() => { st.flight = null; });
}

async function afterShot(hit) {
  if (st.over) return;
  const rack = target();
  if (!rack.some((c) => c.alive)) { // cleared every cup: instant win
    st.over = true; clearMsg(); confetti(); await msg('ALL CUPS!', 1500); return endMatch(st.turn);
  }
  if (st.ball >= BALLS) { // turn complete
    if (st.turnHits >= BALLS) { // both balls went in: extra turn
      st.ball = 1; st.turnHits = 0; updateHud(); await msg('EXTRA TURN!', 1100); return nextBall();
    }
    return turnSwitch();
  }
  st.ball++; updateHud(); await wait(250); return nextBall();
}

async function nextBall() {
  if (st.over) return;
  st.ballVisible = true; st.ballScale = 0; tween(250, (k) => { st.ballScale = ease.back(k); });
  updateHud();
  if (st.turn === 1) return botShot();
  await msg('YOUR SHOT!', 900); st.canThrow = true;
}
async function botShot() {
  await wait(700);
  const rack = target(), live = rack.filter((c) => c.alive);
  if (!live.length) return;
  const ideal = aimAt(live[Math.floor(Math.random() * live.length)]);
  const a = Math.max(-127, Math.min(127, Math.round(ideal.angleQ + gauss() * S.botSigmaA)));
  const p = Math.max(0, Math.min(255, Math.round(ideal.powerQ + gauss() * S.botSigmaP)));
  st.ballVisible = false; takeShot(a, p);
}

async function turnSwitch() {
  const finishedTurn = st.turn, rackOld = target();
  await msg('TURN SWITCH', 900);
  await rackOut(rackOld);
  // round bookkeeping: a round ends when the second player of the round has finished
  if (finishedTurn !== st.first) { if (st.round >= TOTAL_ROUNDS) { st.over = true; return endMatch(null); } st.round++; }
  st.turn = 1 - st.turn; st.ball = 1; st.turnHits = 0;
  await beginTurn();
}
async function beginTurn() {
  updateHud();
  const rack = target(); rack.forEach((c) => { c.sc = 0; c.lift = 0.14; });
  await rackIn(rack);
  await msg(st.turn === 0 ? 'YOUR SHOT!' : "RIVAL'S SHOT", 900);
  st.ballVisible = true; st.ballScale = 0; tween(250, (k) => { st.ballScale = ease.back(k); }); updateHud();
  if (st.turn === 1) return botShot();
  st.canThrow = true;
}

function endMatch(winner) {
  st.phase = 'over'; st.canThrow = false; updateHud();
  const [y, r] = st.scores; const w = winner !== null ? winner : (y > r ? 0 : r > y ? 1 : -1);
  $('endTitle').textContent = w === 0 ? 'YOU WIN!' : w === 1 ? 'RIVAL WINS' : 'DRAW';
  $('endSub').textContent = `${y} - ${r} cups  (${winner !== null ? 'cleared every cup' : TOTAL_ROUNDS + ' rounds'})`;
  if (w === 0) confetti();
  setTimeout(() => show('end', true), 700);
}

// ---- intro + first-turn spinner -----------------------------------------------------------------------------------
async function intro() {
  show('intro', true); await wait(2000); show('intro', false); await wait(300);
  $('startPill').style.opacity = 1; await wait(900); $('startPill').style.opacity = 0;
}
async function spinner() {
  const first = Math.random() < 0.5 ? 0 : 1; // the "ruleta": 0 = you, 1 = rival
  $('whoYou').classList.remove('win'); $('whoRival').classList.remove('win');
  show('spin', true);
  const total = 3 * 360 + (first === 0 ? 0 : 180);
  await tween(2500, (k) => { $('needle').style.transform = `rotate(${total * ease.sineOut(k)}deg)`; });
  (first === 0 ? $('whoYou') : $('whoRival')).classList.add('win');
  await wait(900); show('spin', false); await wait(400);
  return first;
}

async function runMatch() {
  Object.assign(st, {phase: 'idle', turn: 0, round: 1, ball: 1, turnHits: 0, scores: [0, 0], canThrow: false, ballVisible: false, flight: null, fx: [], over: false, racks: newRacks()});
  show('end', false); updateHud();
  if (!$('skipIntro').checked) await intro();
  const first = await spinner();
  st.first = first; st.turn = first; st.phase = 'play';
  await beginTurn();
}
$('again').onclick = () => runMatch();

// ---- main loop ------------------------------------------------------------------------------------------------------------
function frame(now) { drawScene(now); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__st = st; window.__fire = (len, angDeg) => { const r = canvas.getBoundingClientRect(); const x0 = r.width / 2, y0 = project(0, P.releaseH, 0)[1]; const a = angDeg / 57.29578, L = len * H; fire({x0, y0, x: x0 + Math.sin(a) * L, y: y0 - Math.cos(a) * L, len}); };
runMatch();
</script>
